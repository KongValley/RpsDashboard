name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    # 卡住的 job 会一直占着 runner（免费额度按分钟计），20 分钟足够本仓库全套
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check backend
      - run: uv run python -m pytest backend/tests -q --cov-fail-under=50

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
