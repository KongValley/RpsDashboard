[project]
name = "rpsboard"
version = "0.2.0"
description = "A股 RPS（欧奈尔相对价格强度）看板"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "eltdx>=3.2.3",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
#: 只在一次性调研脚本（backend/tests/probe_*/debug_*/clean_probe.py）里用到，
#: 主链路不 import。clone 后日常只需 -e ".[dev]"，要跑探针再加 ,probe
probe = [
    "requests>=2.31",
    "akshare>=1.19",
    "baostock>=0.9",
]

[project.scripts]
rpsboard = "rpsboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/rpsboard"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# 覆盖率门槛放在 CI 的 pytest 命令里（全套实测 TOTAL 80.89% → 门槛 80）：
# 写进 addopts 会让「只跑一个测试文件」也因总覆盖率不足而失败，本地开发很难用。
# timeout 让 pytest-timeout 真正生效（此前装了但没有任何 timeout 设置）。
addopts = "-q --cov=rpsboard --cov-report=term-missing"
timeout = 60

[tool.ruff]
line-length = 110
target-version = "py312"
#: 一次性调研/诊断脚本（policy：README「开发脚本」小节）刻意不参与 lint：
#: 它们当时是现场跑的临时脚本，风格不统一，重排只会淹没真实改动。
extend-exclude = [
    "backend/tests/probe_*.py",
    "backend/tests/debug_*.py",
    "backend/tests/diag_*.py",
    "backend/tests/verify_*.py",
    "backend/tests/clean_probe.py",
    "backend/tests/bench_api.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # 行宽由 line-length 110 提示，注释里中文按显示宽度算会误报
    # zip 的长度相等是上游不变量（对齐后的 date×symbol 宽表 / 同源序列），
    # 显式 strict= 不会带来新信息，反而要改十几处
    "B905",
    # FastAPI 的惯用写法：`req: CollectRequest = Body(default=CollectRequest())`
    "B008",
]
