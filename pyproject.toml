[project]
name = "rpsboard"
version = "0.1.0"
description = "A股 RPS（欧奈尔相对价格强度）看板"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "eltdx>=3.2.3",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
    "httpx>=0.27",
]
#: 只在一次性调研脚本（backend/tests/probe_*/debug_*/clean_probe.py）里用到，
#: 主链路不 import。clone 后日常只需 -e ".[dev]"，要跑探针再加 ,probe
probe = [
    "requests>=2.31",
    "akshare>=1.19",
    "baostock>=0.9",
]

[project.scripts]
rpsboard = "rpsboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/rpsboard"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-m 'not network' -q"
markers = [
    "network: 需要真实网络与第三方数据源（默认不运行，需 --run-network）",
]
